"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "bash scripts/setup.sh"
run_mode = "concurrent"

[scripts.run.verify]
command = "bash scripts/verify.sh"
icon = "badge-check"

[scripts.run.slides]
command = "bash scripts/render_slides.sh && python3 -m http.server $CONDUCTOR_PORT --directory slides/_site"
available_in = [ "local" ]
default = true
icon = "presentation"

